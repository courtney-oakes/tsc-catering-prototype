<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSC Catering Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Sway Display';src:url('fonts/SwayDisplay-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Sway Display';src:url('fonts/SwayDisplay-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'Sway Display';src:url('fonts/SwayDisplay-ExtraBold.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
/* TSC Full Brand ID DLS tokens (resolved from Figma file SfmAJxAmLVxmT7RxYslkGM, Tokens collection) */
:root{
--bg:#FFFEF3;--container:#FFF4E3;--surface:#FCFAEB;--surface-strong:#F3F1DE;--border:#F3F1DE;--border-strong:#F4F0D9;--border-stronger:#D1D6CF;
--ink:#153624;--ink-pressed:#0F2419;--ink-2:#747474;--inverse:#FFFEF3;--inverse-pressed:#F4F0D9;--disabled:#D1D6CF;
--action:#FF6F00;--action-pressed:#CE4900;--action-soft:#FFEEDF;--support-soft:#EAF5F0;--frond:#55D88E;
--err:#BC1612;--err-bg:#FFE8E6;--warn:#DA4D1E;--warn-bg:#FFFBE9;--ok:#3C9232;--ok-bg:#EEFFE3;--info:#386FC4;--info-bg:#EAF3FF;
--overlay:rgba(21,54,36,.65);
--r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-2xl:24px;--r-full:500px;
--f-brand:'Sway Display',system-ui,-apple-system,'Segoe UI',sans-serif;--f-body:'Inter',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
/* legacy aliases used by inline markup */
--g0:var(--bg);--g1:var(--surface);--g2:var(--surface-strong);--g3:var(--border-stronger);--g4:var(--border-stronger);--g5:var(--ink-2);--g6:var(--ink);--g7:var(--ink)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f-body);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg)}
h1,h2,h3{margin:0 0 8px;font-family:var(--f-brand);font-weight:800;letter-spacing:-.005em}
h4{margin:0 0 8px;font-family:var(--f-body);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
h1{font-size:32px;line-height:34px}h2{font-size:20px;line-height:24px}h3{font-size:16px;line-height:20px;font-weight:700}
p{margin:0 0 8px}a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}.grow{flex:1}
.muted{color:var(--ink-2)}.small{font-size:12px}.bold{font-weight:600}.right{text-align:right}
hr{border:0;border-top:1px solid var(--border-stronger);margin:14px 0}
/* top nav */
.top{border-bottom:2px solid var(--border);background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:20px;height:72px}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:var(--f-brand);font-weight:800;font-size:15px;line-height:15px;color:var(--ink);white-space:nowrap}
.logo i{display:block;width:34px;height:34px;border-radius:var(--r-full);background:var(--ink);color:var(--frond);font-style:normal;font-size:12px;line-height:34px;text-align:center}
.nav{display:flex;gap:24px;flex:1}
.nav a{text-decoration:none;color:var(--ink);cursor:pointer;padding:4px 0;border-bottom:3px solid transparent;font-family:var(--f-brand);font-weight:700;font-size:15px}
.nav a:hover{color:var(--action-pressed)}
.nav a.on{border-color:var(--action)}
/* buttons (Primary / Outline / Tertiary, pill, 44px) */
.btn{border:2px solid transparent;background:var(--action);color:var(--ink);padding:8px 16px;min-height:44px;border-radius:var(--r-full);cursor:pointer;font-family:var(--f-brand);font-weight:700;font-size:15px;line-height:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:hover{background:#ff8226}.btn:active{background:var(--action-pressed)}
.btn.sec{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn.sec:hover{background:var(--inverse-pressed)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink);text-decoration:underline;padding:6px 10px}
.btn.ghost:hover{background:var(--surface-strong)}
.btn.sm{padding:4px 12px;min-height:36px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{background:var(--disabled);border-color:transparent;color:var(--ink);opacity:.8;cursor:not-allowed}
.btn.sec[disabled]{background:transparent;border-color:var(--disabled);color:var(--ink-2)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* fields */
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface-strong);border-radius:var(--r-lg);padding:12px 14px;font-family:var(--f-body);font-size:15px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border:2px solid var(--ink);padding:11px 13px}
input::placeholder,textarea::placeholder{color:rgba(21,54,36,.4)}
textarea{min-height:64px}
label.f{display:block;font-family:var(--f-brand);font-size:12px;font-weight:700;color:var(--ink);margin-bottom:12px}
label.f>input,label.f>select,label.f>textarea{margin-top:6px;font-weight:400}
input[type=checkbox],input[type=radio]{accent-color:var(--ink);width:18px;height:18px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
.chk input{margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.chip{border:1px solid var(--border-stronger);background:var(--bg);border-radius:var(--r-full);padding:7px 14px;font-size:13px;font-family:var(--f-brand);font-weight:700;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--surface-strong)}
.chip.on{background:var(--ink);color:var(--inverse);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;border-radius:var(--r-full);padding:2px 9px;font-family:var(--f-brand);font-size:11px;font-weight:700;line-height:16px;color:var(--ink);background:var(--surface-strong);margin:0 4px 4px 0}
.tag.dark{background:var(--ink);color:var(--inverse)}
.box{border:1px solid var(--border-stronger);border-radius:var(--r-xl);padding:18px;background:var(--bg)}
.box.g{background:var(--container);border-color:var(--container)}
.alert{border-radius:var(--r-lg);background:var(--container);padding:12px 14px;margin:10px 0}
.alert.err{background:var(--err-bg);border:1px solid var(--err)}
.img{background:var(--surface-strong);border-radius:var(--r-lg);display:flex;align-items:flex-end;justify-content:flex-start;color:var(--ink-2);font-size:10px;padding:6px;border:1px solid var(--border-strong)}
.img span{background:rgba(255,254,243,.85);padding:1px 6px;border-radius:var(--r-full)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--border-stronger);padding:10px 8px;text-align:left;font-size:13px;vertical-align:top}
th{font-family:var(--f-body);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.stepper{display:inline-flex;border:1px solid var(--border-stronger);border-radius:var(--r-full);align-items:center;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:var(--surface-strong);width:32px;height:32px;cursor:pointer;font-weight:700;font-size:16px;color:var(--ink)}
.stepper button:hover{background:var(--inverse-pressed)}
.stepper button[disabled]{color:var(--disabled);cursor:not-allowed}
.stepper span{min-width:34px;text-align:center;font-weight:600}
/* menu */
.hero{background:var(--container);padding:24px 0 20px}
.ful{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--bg);border:1px solid var(--border-stronger);border-radius:var(--r-xl);padding:12px 18px;margin-top:14px}
.ful .cell{padding-right:16px;border-right:1px solid var(--border-stronger)}
.ful .cell:last-of-type{border:0}
.ful .cell small{display:block;color:var(--ink-2);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.catbar{position:sticky;top:0;background:var(--bg);border-bottom:2px solid var(--border);z-index:5;padding:10px 0;overflow-x:auto;white-space:nowrap}
.catbar .chip{margin-right:6px}
.filters{padding:14px 0;border-bottom:2px solid var(--border)}
.filters .row{margin-bottom:8px}
.filters b{font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);width:84px;display:inline-block}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:12px 0 28px}
.card{border:1px solid var(--border-stronger);border-radius:var(--r-xl);padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--bg);transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--ink);box-shadow:0 6px 16px rgba(21,54,36,.12)}
.card .img{height:120px}
.card h4{color:var(--ink);text-transform:none;font-family:var(--f-brand);font-weight:800;font-size:15px;line-height:19px;letter-spacing:0;margin:0}
.card p{font-size:12px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;padding:20px 0 40px}
.layout.item{grid-template-columns:1fr 1fr}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 0;font-size:12px;color:var(--g5)}
.crumb{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--g5);text-decoration:underline;font-size:12px}
.crumb:hover{color:var(--g7)}
section[id^="cat-"]{scroll-margin-top:68px}
.sticky{position:sticky;top:12px}
.empty{border:1px dashed var(--border-stronger);padding:28px;text-align:center;color:var(--ink-2);border-radius:var(--r-xl);margin:12px 0}
.ov{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.modal{background:var(--bg);border-radius:var(--r-2xl);max-width:680px;width:100%;padding:24px}
.modal.sm{max-width:440px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:410px;max-width:100%;background:var(--bg);z-index:60;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(21,54,36,.2)}
.drawer .body{flex:1;overflow:auto;padding:16px}
.drawer .foot{border-top:2px solid var(--border);padding:14px 16px;background:var(--surface)}
.line{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-strong)}
.line .img{width:56px;height:56px;flex:none;padding:0}
.line .img span{display:none}
.sum td{border:0;padding:3px 0}
.sum tr.t td{border-top:2px solid var(--ink);font-family:var(--f-brand);font-weight:800;padding-top:10px;font-size:16px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps div{flex:1;border-top:4px solid var(--border-stronger);padding-top:6px;font-size:12px;color:var(--ink-2)}
.steps div.on{border-color:var(--action);color:var(--ink);font-family:var(--f-brand);font-weight:700}
.sec-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--inverse);display:flex;align-items:center;justify-content:center;font-family:var(--f-brand);font-weight:700;font-size:12px;flex:none}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:10px 16px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-2px;font-family:var(--f-brand);font-weight:700}
.tabs a.on{color:var(--ink);border-color:var(--action)}
.err-t{color:var(--err);font-size:12px;font-weight:500;margin:-6px 0 10px}
.err-t:before{content:"! "}
.email{border:1px solid var(--border-stronger);border-radius:var(--r-lg);background:var(--bg);padding:16px;font-size:13px}
.email .hd{background:var(--surface);margin:-16px -16px 12px;padding:10px 16px;border-bottom:1px solid var(--border-stronger);font-size:12px;color:var(--ink-2);border-radius:var(--r-lg) var(--r-lg) 0 0}
/* controls panel */
#ctl{position:fixed;left:10px;bottom:10px;z-index:80;background:var(--bg);border:2px solid var(--ink);border-radius:var(--r-lg);width:250px;font-size:12px;overflow:hidden}
#ctl header{background:var(--ink);color:var(--inverse);padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;font-family:var(--f-brand)}
#ctl .b{padding:10px;max-height:60vh;overflow:auto}
#ctl .b label{display:block;margin:4px 0}
#ctl select{padding:3px 6px;font-size:12px;border-radius:var(--r-sm)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--inverse);padding:12px 22px;border-radius:var(--r-full);z-index:100;font-family:var(--f-brand);font-weight:700}
.ann{display:none}
body.ann-on .ann{display:inline-block;background:var(--action-soft);border:1px dashed var(--action-pressed);color:var(--ink);font-size:9px;line-height:1.2;padding:1px 6px;margin:0 0 0 6px;border-radius:var(--r-full);font-weight:600;vertical-align:middle;text-transform:none;letter-spacing:0;font-family:var(--f-body)}
/* footer (inverse) */
.site-footer{background:var(--ink);color:var(--inverse);margin-top:24px}
.site-footer .wrap{padding-top:36px;padding-bottom:96px}
.site-footer .cols{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:24px}
.site-footer h5{margin:0 0 10px;font-family:var(--f-brand);font-weight:800;font-size:14px;color:var(--frond)}
.site-footer a{display:block;color:var(--inverse);text-decoration:none;font-size:13px;margin:6px 0;font-weight:500}
.site-footer .legal{border-top:1px solid rgba(255,254,243,.25);margin-top:24px;padding-top:16px;font-size:12px;color:var(--border-stronger)}

/* view toggle + canvas */
.mode{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:120;display:flex;gap:4px;background:var(--ink);border-radius:var(--r-full);padding:4px;box-shadow:0 8px 24px rgba(21,54,36,.35)}
.mode button{border:0;background:transparent;color:var(--inverse);font-family:var(--f-brand);font-weight:700;font-size:14px;padding:9px 20px;border-radius:var(--r-full);cursor:pointer;min-height:40px}
.mode button.on{background:var(--action);color:var(--ink)}
.mode button:not(.on):hover{background:rgba(255,254,243,.15)}
.cv{background:var(--surface-strong);min-height:100vh;padding:24px 24px 110px}
.cv-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.cv-bar h1{margin:0 0 2px}
.cv-t{margin:28px 0 12px;font-size:22px}
.cv-row{display:flex;gap:24px;overflow-x:auto;padding:4px 4px 20px;align-items:flex-start}
.cv-b{margin:0;flex:none}
.cv-b figcaption{font-family:var(--f-brand);font-weight:700;font-size:13px;margin:0 0 8px}
.cv-f{position:relative;overflow:hidden;background:var(--bg);border-radius:var(--r-lg);box-shadow:0 2px 10px rgba(21,54,36,.15);transition:outline-color .15s;outline:3px solid transparent}
.cv-f:hover{outline-color:var(--action)}
.cv-in{width:1100px;transform-origin:0 0;position:relative;pointer-events:none;background:var(--bg);overflow:hidden}
.cv-open{position:absolute;inset:0;background:transparent;border:0;cursor:pointer;z-index:5}
.cv-f .cv-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--inverse);font-family:var(--f-brand);font-weight:700;font-size:12px;padding:6px 14px;border-radius:var(--r-full);opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
.cv-f:hover .cv-hint{opacity:1}
@media(max-width:860px){.layout,.layout.item{grid-template-columns:1fr}.sticky{position:static}.grid2,.grid3{grid-template-columns:1fr}.nav{display:none}.ful .cell{border:0}.site-footer .cols{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ DATA (menu from EZCater: Tropical Smoothie Cafe, 572 Hank Aaron Dr SE, Atlanta) ============ */

['10 Pack 24 Oz. Smoothies',90.39,'Choose from our best-selling smoothies: Bahama Mama™, Sunrise Sunset™, Mango Monsoon™, Island Green®, Detox Island Green®, Acai Berry Boost™, Peanut Butter Cup™ and Jetty Punch™. Serves 10.',{m:1,i:1,s:10}]]},

{id:'byo',name:'Build Your Own Trays',kind:'byo',occ:['lunch','corporate'],items:[

['Build Your Own Breakfast Tray',60.69,'Select up to 5 breakfast items. Each cut in half for 20 pieces. Serves 10.',{s:10,byo:5,occ:['breakfast'],opts:['All American (bacon) Wrap','Spinach & Pesto Wrap','Southwest Wrap (chicken)','Cali Breakfast Flatbread (chicken)','PB Banana Crunch Flatbread']}],
['Build Your Own Wrap & Sandwich Tray',101.09,'Select up to 10 wraps or sandwiches. Each cut in half for 20 pieces. Serves 10. Served untoasted.',{s:10,byo:10,opts:[...WRAPS,'Turkey Bacon Ranch Sandwich']}],
['Build Your Own Flatbread Tray',91.09,'Select up to 3 flatbreads. Each cut in half for 20 pieces. Serves 10. Served untoasted.',{s:10,byo:3,opts:FLATS}]]},
{id:'salads',name:'Group Salads',kind:'tray',occ:['lunch','corporate'],items:[
['Catering Supergreen Chicken Caesar Salad',41.09,'Grilled chicken, parmesan crisps, shredded parmesan & tomato on fresh romaine and spinach. Served with creamy Caesar dressing on the side. Serves 10.',{m:1,s:10}],
['Catering Kale & Apple Slaw',31.09,'A blend of julienned green apple, shredded carrots, fresh kale & honey Dijon dressing. Serves 10.',{s:10}],
['Catering Thai Chicken Salad',41.09,'Grilled chicken, crispy wontons, shredded carrots & fresh cilantro on fresh romaine. Served with Thai dressing on the side. Serves 10.',{s:10}]]},
{id:'abowls',name:'Assorted Tropic Bowls',kind:'tray',occ:['breakfast','event'],items:[
['Assorted Tropic Bowls',121.09,'4 Acai Bowls, 2 Acai Bowls with NUTELLA®, 2 Bahama Mama™ Bowls & 2 Dragon Fruit Bowls. Serves 10.',{m:1,i:1,s:10}],
['Assorted Breakfast Bowls',101.09,'4 Mixed Berry Greek Yogurt Bowls, 3 PB Protein Crunch Bowls & 3 Chia Oatmeal Bowls. Serves 10.',{i:1,s:10}]]},
{id:'bowls',name:'A La Carte Tropic Bowls',kind:'alc',add:'bowl',occ:['breakfast'],items:[

/* ============ SCROLL SPY: highlight the category chip for the section in view ============ */
function spy(){if(S.mode!=='proto'||S.view!=='menu'||(S._lock&&Date.now()<S._lock))return;
 const secs=Array.from(document.querySelectorAll('section[id^="cat-"]'));if(!secs.length)return;
 const bar=document.querySelector('.catbar');const line=(bar?bar.getBoundingClientRect().bottom:0)+24;
 let cur=secs[0];for(const x of secs){if(x.getBoundingClientRect().top<=line)cur=x;else break}
 if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur=secs[secs.length-1];
 const id=cur.id.slice(4);S.cat=id;
 document.querySelectorAll('.catbar .chip').forEach(c=>{const on=c.dataset.v===id;if(c.classList.contains('on')!==on)c.classList.toggle('on',on);
  if(on&&bar&&bar.scrollTo){const l=c.offsetLeft-bar.clientWidth/2+c.offsetWidth/2;if(Math.abs(bar.scrollLeft-l)>40)bar.scrollTo({left:Math.max(0,l),behavior:'smooth'})}})}
let spyRaf=0;
window.addEventListener('scroll',()=>{if(spyRaf)return;spyRaf=requestAnimationFrame(()=>{spyRaf=0;spy()})},{passive:true});

 let m='';if(S.modal==='ful')m=fulModal();else if(['signin','create','forgot','claim'].includes(S.modal))m=signinModal();else if(S.modal==='dup')m=dupModal();else if(S.modal==='mod')m=modMod();
 document.getElementById('app').innerHTML=header()+views[S.view]()+`<footer class="site-footer"><div class="wrap"><div class="cols"><div><div class="logo" style="color:var(--inverse)"><i style="background:var(--inverse);color:var(--ink)">TSC</i>Tropical Smoothie Cafe</div><p class="small" style="margin-top:12px;color:var(--border-stronger)">Catering prototype · menu and pricing from EZCater (572 Hank Aaron Dr SE, Atlanta). Other cafes, phone numbers, nutrition, allergen and dietary data are placeholders.</p></div><div><h5>About us</h5><a>Our story</a><a>Careers</a></div><div><h5>Food and services</h5><a>Menu</a><a>Catering</a><a>Gift cards</a></div><div><h5>Support</h5><a>Contact us</a><a>FAQ</a></div><div><h5>Legal</h5><a>Accessibility</a><a>Terms of use</a><a>Privacy policy</a></div></div><div class="legal">©2026 TSC Franchisor, LLC</div></div></footer>`+(S.drawer?drawerH():'')+m+ctlPanel()+modeToggle()+(S.toast?`<div id="toast">${S.toast}</div>`:'');
 if(key){const el=document.querySelector(`[data-key="${key}"]`);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
 if(S.mode==='proto'&&S.view==='menu')spy()}

/* ============ ACTIONS ============ */
const ACT={
go:d=>{S.view=d.v;S.drawer=false;S.modal=null;window.scrollTo(0,0)},
drawer:(d,e)=>{S.drawer=!S.drawer},
modal:d=>{S.modal=d.m||null;if(d.m==='ful')S.ful.draft=null},
item:d=>openItem(d.id),
occ:d=>{S.occ=d.v},diet:d=>{const i=S.diet.indexOf(d.v);i<0?S.diet.push(d.v):S.diet.splice(i,1)},
hc:d=>{S.headcount=+d.v},clear:()=>{S.occ='all';S.diet=[]},
cat:d=>{S.cat=d.v;S._lock=Date.now()+900;render();const el=document.getElementById('cat-'+d.v);if(el)el.scrollIntoView({behavior:'smooth'});setTimeout(spy,1000);return 1},
cq:d=>{S.cfg.qty=Math.max(1,S.cfg.qty+ +d.d)},
gstep:d=>{const s=S.cfg.sel[d.g]=S.cfg.sel[d.g]||{};s[d.o]=Math.max(0,(s[d.o]||0)+ +d.d)},
gpick:(d,e)=>{const s=S.cfg.sel[d.g]=S.cfg.sel[d.g]||{};if(d.t==='radio'){S.cfg.sel[d.g]={[d.o]:1}}else{s[d.o]=e.target.checked?1:0}},
mode:d=>{if(d.v==='canvas')S._yp=window.scrollY;S.mode=d.v;render();window.scrollTo(0,d.v==='proto'?(S._yp||0):0);return 1},
zoom:d=>{S.zoom=+d.v},
openboard:d=>{const b=BOARDS[+d.i];S.mode='proto';b.set();window.scrollTo(0,0)},
crumb:d=>{S.view="menu";S.drawer=false;S.cat=d.cat||null;render();const el=d.cat&&document.getElementById("cat-"+d.cat);if(el)el.scrollIntoView();else window.scrollTo(0,0);return 1},
addcart:()=>addToCart(),qadd:d=>quickAdd(d.id,1),
lq:d=>{const l=S.cart[+d.i];l.qty=Math.max(1,l.qty+ +d.d);saveCart()},lrm:d=>{S.cart.splice(+d.i,1);saveCart()},
checkout:()=>{S.drawer=false;S.view='checkout';const u=S.user;if(u.in){S.c.name=S.c.name||u.name;S.c.email=S.c.email||u.email;S.c.phone=S.c.phone||u.phone}
 if(u.corp)S.co.type='corporate';if(!S.ful.valid)S.modal='ful';window.scrollTo(0,0)},
dmode:d=>{const f=S.ful.draft;f.mode=d.v;f.err=null;f.okMsg=null;if(d.v==='pickup'&&!f.cafe)f.cafe='hank'},
dzip:d=>{S.ful.draft.addr=d.v},
pkcafe:d=>{S.ful.draft.cafe=d.v},
altpick:d=>{const f=S.ful.draft;f.mode='pickup';f.cafe=d.v;f.err=null},
validate:()=>{const f=S.ful.draft;const a=f.addr.trim();const z=(a.match(/\b\d{5}\b/)||[])[0];f.err=null;f.okMsg=null;
 if(!z||a.length<5){f.err={t:'Invalid address',m:'Enter a 5-digit ZIP or a full street address including ZIP.'};return}
 if(a.length>5&&!/\d+\s+\w+/.test(a)){f.err={t:'Address not found',m:'We couldn\'t verify this address. Check spelling and try again.'};return}
 const e=ZIPS[z];if(!e||!e.length){f.err={t:'Outside delivery radius',m:`${z} is outside the catering radius of every delivery-enabled cafe. Try pickup or a different address.`,alt:['hank','midtown']};return}
 f.elig=e;f.cafe=e[0];f.okMsg=`Address verified. Nearest catering cafe: ${CAF[e[0]].name}.`},
saveful:()=>{const f=S.ful,d=f.draft;Object.assign(f,{mode:d.mode,addr:d.addr,cafe:d.cafe,elig:d.elig,date:d.date,slot:d.slot,valid:true,draft:null});S.modal=null},
closeful:()=>{S.ful.draft=null;S.modal=null},
tip:d=>{S.tip={mode:'pct',val:+d.v,custom:false}},tipc:()=>{S.tip.custom=true},
promo:()=>{const c=S.promoIn.trim().toUpperCase();const p=PROMOS[c];S.promoErr='';if(!p)S.promoErr='Code not recognized.';else if(p.err)S.promoErr=p.err;else if(p.cafe&&p.cafe!==S.ful.cafe)S.promoErr='This code is only valid at '+CAF[p.cafe].name+'.';else S.promo={...p,code:c}},
unpromo:()=>{S.promo=null;S.promoIn=''},
otype:d=>{S.co.type=d.v},pm:d=>{S.pay.method=d.v},
place:()=>{const e={};const c=S.c,u=S.user;if(!c.name)e['c.name']='Name is required';if(!/\S+@\S+\.\S+/.test(c.email))e['c.email']='Enter a valid email';if(c.phone.replace(/\D/g,'').length!==10)e['c.phone']='Enter a 10-digit phone number';
 if(S.ful.mode==='delivery'&&!c.addr2&&!S.ful.addr)e['c.addr2']='Address required';
 if(S.co.type==='corporate'){if(!S.co.name)e['co.name']='Required';if(!S.co.billName)e['co.billName']='Required';if(!/\S+@\S+/.test(S.co.billEmail))e['co.billEmail']='Valid email required'}
 if(S.pay.method==='card'){if(S.pay.num.replace(/\D/g,'').length<13)e['pay.num']='Enter a valid card number';if(!S.pay.exp)e['pay.exp']='Required';if(!S.pay.cvc)e['pay.cvc']='Required'}
 if(!S.ful.valid){S.modal='ful';return}
 S.errs=e;if(Object.keys(e).length){return}
 const t=totals();const cf=cafe();const id='TSC-'+(48400+Math.floor(Math.random()*500));
 const needApp=u.corp&&u.role==='buyer'&&t.total>THRESH;
 const status=needApp?'pending':(S.pay.method==='card'&&S.pay.result==='fail')?'payment_failed':'confirmed';
 S.order={id,status,t,lines:S.cart.map(l=>({...l})),cafe:S.ful.cafe,mode:S.ful.mode,addr:S.ful.mode==='delivery'?(c.addr2||S.ful.addr):cf.addr,date:S.ful.date,slot:S.ful.slot,instr:c.instr,contact:{...c},co:{...S.co},pay:S.pay.method,cutoff:cutoffText(),
  log:status==='payment_failed'?['Pre-authorization declined ('+new Date().toLocaleTimeString()+')','Customer notified: email + in-app','Cafe alert sent: POS notification to '+cf.name,'Retry attempts: 0']:[]};
 if(status!=='payment_failed'){S.orders.unshift({id,date:S.ful.date,slot:S.ful.slot,mode:S.ful.mode,cafe:S.ful.cafe,guests:S.headcount,total:t.total,status:status==='pending'?'Pending approval':'Confirmed',lines:S.cart.map(l=>({...l})),guest:!u.in,po:S.co.po});if(needApp)S.approvals.unshift({id,by:u.name,amt:t.total,st:'Pending'});S.cart=[];saveCart()}
 S.emailTab='confirm';S.view='confirm';window.scrollTo(0,0)},
retry:()=>{const o=S.order;o.log.push('Retry succeeded ('+new Date().toLocaleTimeString()+')');o.status='confirmed';S.orders.unshift({id:o.id,date:o.date,slot:o.slot,mode:o.mode,cafe:o.cafe,guests:S.headcount,total:o.t.total,status:'Confirmed',lines:o.lines,guest:!S.user.in});S.cart=[];saveCart();S.pay.result='success'},
chgpay:()=>{S.pay.result='success';S.view='checkout'},
cancel:()=>{S.order.status='cancelled';const x=S.orders.find(o=>o.id===S.order.id);if(x)x.status='Cancelled'},
modmodal:()=>{S.modal='mod'},modsave:()=>{S.modal=null;S.toast='Order updated – new confirmation email sent'},
etab:d=>{S.emailTab=d.v},
tab:d=>{S.tab=d.v},ctab:d=>{S.ctab=d.v},
reorder:d=>{const o=S.orders.find(x=>x.id===d.id);o.lines.forEach(l=>S.cart.push({...l}));saveCart();S.drawer=true;S.view='menu'},
dup:d=>{const o=S.orders.find(x=>x.id===d.id);S.dup={id:o.id,hc:o.guests,date:addDays(7),addr:S.ful.addr||'000 Main St, Atlanta, GA 30315'};S.modal='dup'},
dupgo:()=>{const o=S.orders.find(x=>x.id===S.dup.id);o.lines.forEach(l=>S.cart.push({...l}));S.headcount=+S.dup.hc;S.ful.date=S.dup.date;S.ful.addr=S.dup.addr;saveCart();S.modal=null;S.drawer=true;S.view='menu'},
signout:()=>{S.user.in=false;S.view='menu'},
login:()=>{S.user.in=true;S.modal=null},create:()=>{S.user.in=true;S.modal=null;S.toast='Account created'},
forgot:()=>{S.modal=null;S.toast='Reset link sent (expires in 30 min, single use)'},
claim:()=>{S.modal=null;S.toast='Order claimed and attached to your account'},
toggleIn:(d,e)=>{S.user.in=e.target.checked},toggleCorp:(d,e)=>{S.user.corp=e.target.checked;if(e.target.checked)S.user.in=true},
ctltoggle:()=>{S.ctl=!S.ctl},
delask:()=>{S.delConfirm=true},delcancel:()=>{S.delConfirm=false},deldo:()=>{S.delConfirm=false;S.toast='Deletion request received – confirmation email to follow'},
saved:()=>{S.toast='Profile saved'},exp:d=>{S.toast='Exporting '+d.f+'…'},invite:()=>{S.users.push({n:'New user',e:'invite@example.com',r:'Buyer'});S.toast='Invitation sent'},
appr:d=>{S.approvals[+d.i].st=d.v},porequest:()=>{S.po='pending'},upload:()=>{S.taxcert='pending';S.certFile='tax-exempt-cert.pdf'},
demo:()=>{if(!S.cart.length){S.cart=[{id:'trays-0',qty:3,sel:{},unit:101.09,sum:'',note:''},{id:'sweets-0',qty:25,sel:{},unit:1.99,sum:'',note:''}]}
 S.ful.mode='delivery';S.ful.addr='30315';S.ful.cafe='hank';S.ful.elig=['hank','midtown'];S.ful.valid=true;ACT.checkout({})}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.tagName==='INPUT'&&(t.type==='checkbox'||t.type==='radio')&&e.type==='click'&&false)return;
 if(t.dataset.bg&&e.target!==t)return;if(t.tagName==='INPUT')return;
 const r=ACT[t.dataset.act]&&ACT[t.dataset.act](t.dataset,e);if(r!==1)render()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.act&&t.tagName==='INPUT'){ACT[t.dataset.act](t.dataset,e);render();return}
 if(t.dataset.bind){bind(t);if(!t.dataset.live)render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.bind&&(t.tagName==='TEXTAREA'||['text','email','tel','password','number'].includes(t.type))){bind(t);if(t.dataset.live)render()}});
function bind(t){let v=t.type==='checkbox'?t.checked:t.dataset.num!==undefined?(+t.value||0):t.value;const p=t.dataset.bind;
 if(p.startsWith('users.')){const [,i,k]=p.split('.');S.users[i][k]=v;return}
 if(p==='claimId'||p==='claimEm'){S[p]=v;return}
 if(p==='headcount'&&v<1)v=1;if(p==='tip.val'){S.tip.val=v;return}
 if(p==='ann'){S.ann=v;return}
 setP(S,p,v)}
render();
